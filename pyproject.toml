[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdm1"
version = "0.1.0"
description = "Structured-data model abstraction: NVIDIA SDM (TabICLv2, TabFM, Kumo*) and other tabular/relational foundation models — one Python API, one result shape, normalized telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Alejandro Del Villar" }]
keywords = [
  "structured-data",
  "tabular",
  "relational",
  "foundation-models",
  "nvidia-sdm",
  "tabiclv2",
  "in-context-learning",
  "routing",
  "telemetry",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

# Stdlib-only. The torch + NVIDIA `sdm` stack (Python >=3.11, CUDA) lives in a
# dedicated venv that backend providers shell out to via subprocess — the core
# never imports it. See the `[models]` extra and CLAUDE.md hard rules.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.6",
]
# `pip install 'sdm1[models]'` — the GPU/backend stack for the nvidia-sdm
# provider (nvidia/Kumo-Tabular weights via `sdm.models.KumoTabular`).
# Requires Python >=3.11 + CUDA; the core never imports any of it.
models = [
  "structured-data-models",
]

[project.urls]
Homepage = "https://github.com/adelvillar1/sdm1"
Repository = "https://github.com/adelvillar1/sdm1"
Issues = "https://github.com/adelvillar1/sdm1/issues"

[project.scripts]
sdm1 = "sdm1.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sdm1"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
